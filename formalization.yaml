status:
  scope: >-
    Formalised: the complete proof of the theorem stated in Challenge.lean, from Mathlib: Zudilin's
    linear forms and his denominator bound (Lemma 19) for every admissible configuration, the prime
    number theorem (from a vendored Lean proof of the Wiener–Ikehara theorem), the certified
    φ-table and the growth of the denominators, the upper bound (Theorem U) with its numerical
    inequalities, the auxiliary-prime separation (Theorem N), Dirichlet's theorem (from Mathlib) and
    the criterion. The certified computations are checked by the Lean kernel (decide +kernel and
    norm_num). Not formalised: the refined denominator bound of docs/proof.md (route R1) and the
    saddle-point analysis of docs/window/proof.md; the theorem does not need them. The theorem says
    that ζ(7), ζ(9), …, ζ(21) are not all rational. It does not say which of them is irrational, and
    it gives no irrationality measure and no effective bound.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: ZetaWindow.zeta_7_to_21_not_all_rational_palomar
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json

automation:
  methods:
    - method: agent
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        One interactive Claude Code session running an Anthropic Claude model, directed by the human
        maintainer, orchestrated the work. It set up the research program on odd zeta values that
        led to this result, chose among the directions it produced, launched and integrated the
        subagent workflows listed below (all run with Anthropic Claude models), and prepared the repository
        for publication (removal of the unused files of the {7, 9, 11} copy; the Challenge,
        Solution and metadata files) with a preparer subagent and an auditor subagent.
      cost:
        wall_time: >-
          The session ran from 2026-09-23 to 2026-09-26 and also covered the two 2-adic
          repositories listed under related_formalizations. The research behind this result ran
          on 2026-09-24 and 2026-09-25 (the literature search continued on 2026-09-26), and its
          Lean development ran from 2026-09-25 to 2026-09-26 (the published history starts from a
          single squashed commit).
        spend_usd: "not tracked"
        hardware: >-
          Anthropic API models; Lean builds and exact-arithmetic Python computations on a local
          workstation (32 threads), GPU computations for the exploratory parameter searches
    - method: autonomous
      framework: "Claude Code subagents launched by workflow scripts"
      tool_setup: >-
        Research subagents searched configurations of Zudilin's forms with exact-arithmetic and GPU
        computations and found the configuration used here (the first informal proof built on it,
        docs/window/proof.md, is credited under the next method). Three refinement tracks (Theorem
        U, Theorem N and a refined denominator bound), each re-derived by an adversarial verifier
        subagent with its own code, and an assembler and final-referee subagent produced
        docs/proof.md; literature subagents searched for prior results. An architect subagent wrote
        the blueprint (BLUEPRINT_WINDOW.md), the definitions and statements
        (Zeta2Lean/Window/Defs.lean, Statements.lean), the assembly and the exact-arithmetic mirror
        (python/window_mirror.py). Two auditor subagents checked the
        definitions and statements with independent code (python/window_audit/). Prover subagents,
        one per proof file, wrote the Lean proofs against frozen statements, including the
        certified φ-table checker and the certificates of Theorem U; a restater subagent moved the
        statements to route R2 of docs/proof.md once Theorems U and N were available; integrator
        subagents built the project, ran the sorry and axiom census and replayed every module with
        Lean's leanchecker.
      prompting_notes: >-
        Task specifications were the statement docstrings and the "Workflow for provers" section of
        BLUEPRINT_WINDOW.md. Statements were frozen, and provers reported problems back instead of
        editing them.
    - method: autonomous
      framework: "Claude Code subagents launched by a workflow script"
      tool_setup: >-
        One separate research workflow of the same session, run on 2026-09-24 and 2026-09-25, coordinated several research directions on
        the real odd zeta values. Its direction window-21-proof took the configuration found by the
        searches above and wrote the first informal proof, docs/window/proof.md (route R4 of
        docs/proof.md §6, with the saddle-point analysis), together with the scripts
        docs/window/zud5.py, explore.py, certify_line.py and barnes_check.py, whose outputs are the
        certificate and log files next to them. It wrote neither docs/proof.md nor any Lean code;
        the refinement tracks, docs/proof.md and the formalisation built on its proof are credited
        under the previous method.
  spend_usd: "not tracked"
  notes: >-
    The mathematics (the configuration, Theorems U and N, and the informal proofs docs/proof.md and
    docs/window/proof.md, on Zudilin's construction) and all Lean code of this repository, except
    the vendored files in Zeta2Lean/Cited/Vendor/PNT (by Terence Tao and the PrimeNumberTheoremAnd
    contributors), were produced by AI agents (Anthropic Claude models; the
    first informal proof docs/window/proof.md and its scripts were written by a separate research
    workflow, see the third method; the commit is co-authored by Claude) under the
    direction of the human maintainer. The maintainer posed the research question that led to
    this work (the irrationality of odd zeta values such as ζ(7)), directed and supervised the
    runs, and is responsible for the submission. No human expert has checked the informal proof or
    the Lean proof. The history of each round is in STATUS_WINDOW.md and
    BLUEPRINT_WINDOW.md (commit hashes there refer to the unpublished development history).

fidelity:
  divergences: >-
    None in the statement, which uses only Mathlib's riemannZeta: "rational" means "equal to the
    image in ℂ of a rational number", and for integers k ≥ 2 Mathlib's riemannZeta k equals
    Σ_{m ≥ 1} m^(−k) (zeta_nat_eq_tsum_of_gt_one). The Lean proof follows route R2 of docs/proof.md
    with weaker constants (the denominators are at most e^(748n) and the forms at most e^(−748.1n)
    for large n; docs/proof.md has e^(747.0513n+o(n)) and K n^16 e^(−750.618n)) and its own
    kernel-checked certificates in place of the certificate files of docs/window/refine; it proves
    the results that docs/proof.md cites for this route (Zudilin's Lemma 19, the prime number
    theorem). README.md lists the differences. The refined denominators (route R1) and the
    saddle-point analysis of docs/window/proof.md are not formalised.

review:
  status: agent-reviewed
  reviewers:
    - "Claude auditor and verifier subagents (AI systems, not human reviewers)"
  notes: >-
    Not peer-reviewed: no human expert has checked the informal proof (docs/proof.md) or the Lean
    proof. Before submission: (1) each of the three tracks behind docs/proof.md was re-derived by
    an adversarial verifier subagent with its own code, and the assembler checked the joins between
    them (docs/proof.md §§5 and 8). (2) Two adversarial AI audit passes (STATUS_WINDOW.md,
    "Adversarial audit (window)"; code and logs in python/window_audit/) checked the definitions
    and every statement for faithfulness to Zudilin's paper and to the informal proof and for
    soundness (no vacuous statement, no junk-value loophole), with independent exact-arithmetic
    recomputations; the mirror python/window_mirror.py checks every statement numerically (415,069
    checks, 0 failures). (3) The sorry and axiom census and a kernel replay of every module with
    leanchecker; CI repeats both. (4) #print axioms of the main theorems lists only propext,
    Classical.choice and Quot.sound. (5) On 2026-09-26 the toolchain's lake comparator, run as
    Palomar runs it (Challenge.lean compiled outside Lake against Mathlib only, both modules
    exported with leanexport, Lean's kernel plus the NanoDa and con-ron kernels), accepted
    Solution.lean against Challenge.lean; the run was unsandboxed, because bubblewrap was not
    installed on that machine. An altered copy of Challenge.lean, with ζ(23) in place of ζ(21), was
    rejected. An auditor subagent repeated the run the same day with the same result, and a second
    altered copy, with ∃ q : ℤ in place of ∃ q : ℚ, was also rejected (STATUS_WINDOW.md,
    "Independent pre-publication audit"). (6) Before publication the unused files of the {7, 9, 11}
    copy were removed; a declaration-level comparison (the type and value hashes of every constant
    of the project modules) showed that no remaining declaration changed. (7) On 2026-09-28, for
    Palomar's source requirements, every Lean file was ported to Lean's module system (a module
    header, public imports and an @[expose] public section; the two certificate generators emit the
    same header). No statement or proof changed. The project was rebuilt, #print axioms rechecked
    (the same three axioms), Palomar's source-requirement check (PalomarSubmission 65f0154) found no
    issue, and the Palomar-style comparator run was repeated: Solution.lean accepted by Lean's kernel,
    NanoDa and con-ron (78 327 declarations), an altered Challenge with ζ(23) in place of ζ(21)
    rejected.

alignment:
  namespace: ZetaWindow
  statements:
    - source: "docs/proof.md §0, Theorem"
      lean: ZetaWindow.zeta_7_to_21_not_all_rational_palomar
      module: Challenge (statement), Solution (proof)
      status: proved
      note: >-
        Solution.lean proves it by ZetaWindow.zeta_7_to_21_not_all_rational
        (Zeta2Lean/Window/Main.lean), which has the same type.
    - source: "docs/proof.md §1, the linear form (1.1) and the vanishing coefficients"
      lean: ZetaWindow.LinearForm_proof
      module: Zeta2Lean.Window.Proofs.LinearForm
      status: proved
      note: >-
        For every admissible configuration; with ZetaWindow.PF_proof (partial fractions) and
        ZetaWindow.CoeffVanish_proof (the vanishing of the ζ(r) and even-ζ coefficients).
    - source: "Zudilin, JTNB 16 (2004), Lemma 19 (denominators); docs/proof.md §2.1, §4 S3"
      lean: ZetaWindow.Lemma19_proof
      module: Zeta2Lean.Window.Proofs.Lemma19
      status: proved
      note: "For every admissible configuration and every n, from the brick lemmas (JTNB Lemmas 15–18)."
    - source: "Zudilin, JTNB 16 (2004), Proposition 5 (growth of the denominators); docs/window/proof.md §2"
      lean: ZetaWindow.DenomGrowth_proof
      module: Zeta2Lean.Window.Proofs.DenomGrowth
      status: proved
      note: >-
        Δₙ ≤ e^(748n) eventually, with the prime number theorem (Zeta2.PNT_proof), the certified
        φ-table (ZetaWindow.PhiTable_proof, ZetaWindow.PhiData_proof) and ZetaWindow.OmegaPhi0_proof.
    - source: "docs/proof.md §2.3, Theorem U"
