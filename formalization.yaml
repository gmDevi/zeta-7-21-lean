      declarations, collected in Zeta2Lean/Cited/PNT.lean, with the statement PNT_Stmt in
      Zeta2Lean/Cited/PNTStatement.lean). The mathematics is different: that result concerns 2-adic
      values.
  - id: "https://github.com/gmDevi/zeta2-7-9-lean"
    relationship: builds-on
    note: >-
      Formalisation by the same maintainer, registered in the Palomar registry as
      PALOMAR-2026-09-25-000026 (commit 3797cb6e4f8653744c0aa8e66ec8eb3645e75dcd): at least one of
      the 2-adic zeta values ζ₂(7), ζ₂(9) is irrational. Its growth bound uses the same contour
      technique as Theorem U here. Zeta2Lean/Window/Proofs/L20U/VLine.lean (from
      Zeta2Lean/Pair/Proofs/Growth.lean), Zeta2Lean/Window/Proofs/L20U/Numerics.lean (from
      Zeta2Lean/Pair/Proofs/Landscape/Numerics.lean) and the first block of
