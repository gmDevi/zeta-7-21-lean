# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (https://github.com/mathlib-initiative/formalization.yaml), with the
# fields Palomar requires (https://github.com/PalomarRegistry/PalomarPolicy/blob/main/CONTRIBUTING.md).
version: "v0.4"

project:
  name: "At least one of ζ(7), ζ(9), …, ζ(21) is irrational"
  description: >-
    A Lean 4 and Mathlib proof that at least one of the eight values ζ(7), ζ(9), ζ(11), ζ(13),
    ζ(15), ζ(17), ζ(19), ζ(21) of the Riemann zeta function is irrational. The statement uses only
    Mathlib's riemannZeta, the theorem has no hypotheses, and its proof uses only the axioms
    propext, Classical.choice and Quot.sound. The shortest list of odd zeta values starting at ζ(7)
    that our literature search found proved to contain an irrational number was ζ(7), ζ(9), …,
    ζ(35) (W. Zudilin, Math. Notes 2001). The proof uses the very-well-poised linear forms of Zudilin
    (J. Théor. Nombres Bordeaux 2004, §8) with five derivatives, 23 factors and the direction vector
    η₀ = 160, η = (47, 47, 47, 47, 48, 50, 50, 51, 52, …, 66); they are linear forms in 1, ζ(7),
    ζ(9), …, ζ(21) with rational coefficients. Zudilin anticipated such an improvement but could
    not prove the asymptotics of his forms (his Lemma 20) for more than three derivatives. The proof
    here does not need them. The denominators of the coefficients are bounded by Zudilin's arithmetic lemma,
    the prime number theorem (proved from a vendored Lean proof of the Wiener–Ikehara theorem) and
    a kernel-checked table of 2602 pieces of Zudilin's function φ. For large n the forms are bounded
    by e^(−748.1n), through a contour integral on a fixed vertical line, pointwise estimates and
    certified numerical inequalities, without saddle-point analysis. They are non-zero if the eight
    values are rational, because at the auxiliary primes ℓ = 63n − 1, of which there are infinitely
    many by Dirichlet's theorem, the constant term has ℓ-adic valuation −5 while the coefficients of
    the zeta values are ℓ-integral. The theorem does not say which value is irrational. The
    mathematics and the Lean code were produced by AI agents under human direction and have not been
    refereed.
  # Humans only: AI systems are credited in automation.methods, never here.
  authors:
    - "Gennaro Marco Devincenzis"
  responsible_maintainers:
    - "Gennaro Marco Devincenzis"
  license: "Apache-2.0"

classification:
  arxiv: [math.NT]
  msc2020: [11J72, 11M06, 33C20]

sources:
  - title: >-
      At least one of ζ(7), ζ(9), …, ζ(21) is irrational (informal proof in docs/proof.md of this
      repository)
    type: original-proof
    id: "docs/proof.md (this repository)"
    relationship: other
    note: >-
      The theorem is first presented here, by the informal proof docs/proof.md (with its first
      version docs/window/proof.md and the track write-ups in docs/window/refine/) and this Lean
      formalisation. Both were produced by AI agents under the direction of the maintainer (see
      automation) and have not been refereed. The construction is Zudilin's, and the proof carries
      out, for one configuration, the improvement Zudilin anticipated at the end of §8 of his 2004
      paper (see that source). README.md lists how the Lean proof differs from docs/proof.md (it
      follows route R2 of docs/proof.md §6, with weaker constants and its own certificates).
      Literature search (2026-09-24 to 2026-09-26, by AI agents): Zudilin's publication list; arXiv,
      with author searches for Zudilin, Rivoal, Fischler, Lai and Sprang up to September 2026;
      zbMATH Open; the lists of works citing Zudilin's papers of 2001–2004 in OpenAlex, Semantic
      Scholar, mathnet.ru and Google Scholar; Zudilin's 2011 survey and 2013 habilitation thesis;
      Zenodo. No list of odd zeta values starting at ζ(7) shorter than ζ(7), …, ζ(35) and known to
      contain an irrational number was found, and no execution of Zudilin's remark. An unrefereed
      preprint claims that ζ(7) is irrational, which would imply the result (listed below).
      MathSciNet was not searched. Novelty beyond this search is not established.

  - title: "Arithmetic of linear forms involving odd zeta values"
    authors: ["Wadim Zudilin"]
    type: paper
    id: "https://doi.org/10.5802/jtnb.447"
    location: >-
      J. Théor. Nombres Bordeaux 16 (2004), no. 1, 251–291; arXiv:math/0206176. Section 8: the
      very-well-poised forms (8.1)–(8.13), Lemmas 15–19 (arithmetic), Lemma 20 (asymptotics),
      Proposition 5 (the irrationality criterion and the growth of the denominators), and the
      remark at the end of Section 8 (p. 286).
    relationship: other
    note: >-
      The construction and its arithmetic. The linear forms, the denominator bound (Lemma 19, built
      from the elementary bricks of Lemmas 15–18) and the criterion of Proposition 5 are Zudilin's,
      used here with r = 5, q = 23, η₀ = 160, η = (47, 47, 47, 47, 48, 50, 50, 51, 52, …, 66); they
      are restated and proved in Lean here (Zeta2Lean/Window) for every admissible configuration.
      Zudilin proves Lemma 20, the asymptotics of the forms, only for r = 3, and remarks at the end
      of Section 8 that his lists ζ(7), …, ζ(35) and ζ(9), …, ζ(51) can be improved with these forms
      but that he could not prove the general case of Lemma 20. The recorded theorem is such an
      improvement; Lemma 20 is not used, and the new Theorems U and N of docs/proof.md replace it.
      The paper's theorems themselves are not formalised.
    author_endorsement: not-contacted

  - title: "One of the eight numbers ζ(5), ζ(7), …, ζ(17), ζ(19) is irrational"
    authors: ["Wadim Zudilin"]
    type: paper
    id: "https://doi.org/10.1023/A:1012312315852"
    location: >-
      Math. Notes 70 (2001), no. 3–4, 426–431 (translated from Mat. Zametki 70 (2001), no. 3,
      472–476; author name V. V. Zudilin). Theorem 2.
    relationship: other
    note: >-
      Prior result that the recorded theorem improves: Theorem 2 states that at least one of ζ(7),
      ζ(9), …, ζ(35) is irrational, and the recorded theorem shortens this list to ζ(7), …, ζ(21).
      Nothing of this paper is formalised or used in the proof.
    author_endorsement: not-contacted

  - title: "At least two of ζ(5), ζ(7), …, ζ(35) are irrational"
    authors: ["Li Lai", "Li Zhou"]
    type: paper
    id: "https://doi.org/10.5486/PMD.2022.9252"
    location: >-
      Publ. Math. Debrecen 101 (2022), no. 3–4, 353–372; arXiv:2103.00904. Theorem 1.2.
    relationship: background
    note: >-
      Related result, not used in the proof. Two of ζ(5), ζ(7), …, ζ(35) are irrational; in
      particular one of ζ(7), …, ζ(35) is, the same list as Zudilin's Theorem 2 of 2001. The
      recorded theorem gives a shorter list with one irrational value; neither result implies the
      other.
    author_endorsement: not-contacted

  - title: "Many p-adic odd zeta values are irrational"
    authors: ["Li Lai", "Johannes Sprang"]
    type: paper
    id: "https://arxiv.org/abs/2306.10393"
    location: >-
      arXiv:2306.10393 (v2, 2025; to appear in Michigan Math. J.). Lemma 2.3 (the Archimedean
      irrationality criterion with auxiliary primes ℓ(n); Lemma 2.2 is the p-adic version).
    relationship: other
    note: >-
      The nonvanishing step is an instance of Lemma 2.3: if the values were rational, then at the
      auxiliary prime ℓ = 63n − 1, where the constant term of the form has strictly smaller ℓ-adic
      valuation than the coefficients of the zeta values, the form cannot vanish. The consequence
      needed here (ZetaWindow.Fn_frequently_ne_zero, with the valuations of
      ZetaWindow.AuxPrime_proof) is proved in Lean; the lemma is not formalised as stated in the
      paper.
    author_endorsement: not-contacted

  - title: >-
      The Wiener–Ikehara Tauberian theorem and the prime number theorem, in the Lean 4 proofs of
      mathlib4 pull requests #43046, #43233 and #43238
    authors:
      - "Jose Francisco Antonio Balderas"
      - "Vincent Beffara"
      - "Alex Kontorovich"
      - "Terence Tao"
      - "Ruben Van de Velde"
      - "Arend Mellendijk"
      - "Alastair Irving"
    type: other
    id: "https://github.com/leanprover-community/mathlib4/pull/43238"
    location: >-
      Head commit 78e1b2bbd0d256081c926fccada84fd084653286 of pull request #43238, which contains
      #43046 and #43233 (open, not merged in Mathlib as of 2026-09-25). Authors as in the file
      headers.
    relationship: other
    note: >-
      This source is Lean code, not a paper, hence type other; the pull requests are also listed
      under related_formalizations. The prime number theorem ψ(x)/x → 1 is needed for the growth of
      the denominators. It is proved in Lean here (Zeta2.PNT_proof) from the Wiener–Ikehara theorem,
      whose Lean proof is vendored verbatim, with porting notes and the upstream Apache-2.0 headers,
      in Zeta2Lean/Cited/Vendor/PNT. The derivation of the prime number theorem follows
      WeakPNT.lean of #43238. The pull requests are by Terence Tao and adapt code of the
      PrimeNumberTheoremAnd project (see related_formalizations). This is an ingredient of the
      proof, not the recorded result.
    license: "Apache-2.0"
    author_endorsement: not-contacted

  - title: >-
      La fonction zêta de Riemann prend une infinité de valeurs irrationnelles aux entiers impairs
    authors: ["Tanguy Rivoal"]
    type: paper
    id: "https://doi.org/10.1016/S0764-4442(00)01624-4"
    location: "C. R. Acad. Sci. Paris Sér. I Math. 331 (2000), no. 4, 267–270; arXiv:math/0008051"
    relationship: background
    note: >-
      Infinitely many values ζ(2k+1) are irrational. Context: the hypergeometric construction of
      linear forms in odd zeta values on which Zudilin's forms build.

  - title: "Irrationalité d'une infinité de valeurs de la fonction zêta aux entiers impairs"
    authors: ["Keith Ball", "Tanguy Rivoal"]
    type: paper
    id: "https://doi.org/10.1007/s002220100168"
    location: "Invent. Math. 146 (2001), no. 1, 193–207"
    relationship: background
    note: >-
      The dimension of the span of 1, ζ(3), ζ(5), …, ζ(a) over ℚ grows like log a. Context: the
      very-well-poised series behind Zudilin's forms.

  - title: "Zeta 7 is Irrational"
    authors: ["Prince Anand"]
    type: paper
    id: "https://doi.org/10.5281/zenodo.22920911"
    location: "Zenodo preprint, 23 September 2026"
    relationship: background
    note: >-
      Unrefereed preprint claiming that ζ(7) is irrational, by Hankel determinants after the method
      of A. Fauzan's preprint below. If correct, it would imply the recorded theorem. Our own
      check could not confirm two constants on which its final inequality rests, so we do not
      regard ζ(7) as settled. Not used here.
    author_endorsement: not-contacted

  - title: "ζ(5) is irrational"
    authors: ["Aabir Fauzan"]
    type: paper
    id: "https://doi.org/10.5281/zenodo.22826419"
    location: "Zenodo preprint, 17 September 2026"
    relationship: background
    note: >-
      Unrefereed preprint claiming that ζ(5) is irrational; Lean formalisations of it have been
      announced by others. Context for lists of odd zeta values that start at ζ(7). Not used here.
    author_endorsement: not-contacted

